profile:
  name: v2ProPlus

experiment:
  name: speaker_001
  output_root: runs

device:
  device: cuda:0
  precision: fp16

dataset:
  manifest: D:/dataset/data.list

objective:
  training_languages:
    - ja
  target_languages:
    - zh
    - ja
    - en
  cross_language_preservation: strict

preprocess:
  resume: true

s2:
  enabled: true
  batch_size: 2
  target_steps: 800
  checkpoint_every_steps: 200
  learning_rate: 0.0001
  text_low_lr_rate: 0.4
  freeze_quantizer: true
  grad_ckpt: false
  resume_from: null

s1:
  enabled: true
  batch_size: 2
  gradient_accumulation: 4
  target_optimizer_steps: 500
  checkpoint_every_steps: 100
  resume_from: null

evaluation:
  enabled: true
  reference:
    audio: D:/dataset/reference.wav
    text: 今日はいい天気ですね。
    language: ja
  speaker_references:
    - D:/dataset/reference.wav
  suites:
    zh: configs/eval/zh.txt
    ja: configs/eval/ja.txt
    en: configs/eval/en.txt
    mixed: configs/eval/mixed.txt
  models:
    asr: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    speaker: microsoft/wavlm-base-plus-sv
    cache_dir: D:/AI-Training/AI-cache/huggingface/hub
  pairing:
    s2_keep: 2
    shortlist_size: 3
  constraints:
    min_speaker_similarity:
      zh: 0.70
      ja: 0.75
      en: 0.70
    max_cer:
      zh: 0.30
      ja: 0.25
    max_wer:
      en: 0.35
    min_language_consistency:
      zh: 0.50
      ja: 0.50
      en: 0.50
      mixed: 0.50
  ranking:
    speaker: 0.60
    pronunciation: 0.25
    language_consistency: 0.10
    prosody: 0.05
