[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-pipeline"
version = "0.1.0"
description = "Self-contained GPT-SoVITS v2ProPlus training and inference pipeline"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "PyYAML>=6"]

[project.scripts]
voice-pipeline = "voice_pipeline.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["gpu: requires CUDA and local model weights"]
