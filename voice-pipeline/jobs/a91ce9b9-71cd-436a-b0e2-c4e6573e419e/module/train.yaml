profile:
  name: v2ProPlus
experiment:
  name: Lucy
  output_root: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\runs
device:
  device: cuda:0
  precision: fp16
dataset:
  manifest: D:\AI-Training\voice-clone\train_data\lucy\dataset.list
objective:
  training_languages:
  - ja
  target_languages:
  - zh
  - ja
  - en
  cross_language_preservation: strict
preprocess:
  resume: true
s2:
  enabled: true
  batch_size: 2
  target_steps: 600
  checkpoint_every_steps: 200
  learning_rate: 0.0001
  text_low_lr_rate: 0.4
  freeze_quantizer: true
  grad_ckpt: false
s1:
  enabled: true
  batch_size: 2
  gradient_accumulation: 4
  target_optimizer_steps: 500
  checkpoint_every_steps: 100
evaluation:
  enabled: true
  reference:
    audio: D:\AI-Training\voice-clone\train_data\lucy\clips\cv_e153d4bd_0001.wav
    text: ふーん、あら、面白そうなものがある
    language: ja
  speaker_references:
  - D:\AI-Training\voice-clone\train_data\lucy\clips\cv_e153d4bd_0001.wav
  suites:
    zh: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\configs\eval\zh.txt
    ja: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\configs\eval\ja.txt
    en: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\configs\eval\en.txt
    mixed: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\configs\eval\mixed.txt
  models:
    cache_dir: D:\AI-Training\voice-clone\voice-pipeline\voice-pipeline\models\evaluators
  pairing:
    s2_keep: 2
    shortlist_size: 3
